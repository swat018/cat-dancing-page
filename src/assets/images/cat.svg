<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Cat body -->
  <ellipse cx="100" cy="140" rx="50" ry="40" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="80" r="40" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>

  <!-- Cat ears -->
  <polygon points="75,50 85,30 95,50" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>
  <polygon points="105,50 115,30 125,50" fill="#FF8C42" stroke="#E67E22" stroke-width="2"/>

  <!-- Inner ears -->
  <polygon points="78,47 83,35 88,47" fill="#FF6B6B"/>
  <polygon points="112,47 117,35 122,47" fill="#FF6B6B"/>

  <!-- Cat eyes -->
  <ellipse cx="90" cy="75" rx="8" ry="12" fill="#2C3E50"/>
  <ellipse cx="110" cy="75" rx="8" ry="12" fill="#2C3E50"/>

  <!-- Eye pupils -->
  <ellipse cx="90" cy="75" rx="3" ry="8" fill="#ECF0F1"/>
  <ellipse cx="110" cy="75" rx="3" ry="8" fill="#ECF0F1"/>

  <!-- Cat nose -->
  <polygon points="100,85 95,90 105,90" fill="#E74C3C"/>

  <!-- Cat mouth -->
  <path d="M 100 90 Q 95 95 90 90" stroke="#2C3E50" stroke-width="2" fill="none"/>
  <path d="M 100 90 Q 105 95 110 90" stroke="#2C3E50" stroke-width="2" fill="none"/>

  <!-- Cat whiskers -->
  <line x1="70" y1="80" x2="50" y2="75" stroke="#2C3E50" stroke-width="2"/>
  <line x1="70" y1="88" x2="50" y2="88" stroke="#2C3E50" stroke-width="2"/>
  <line x1="130" y1="80" x2="150" y2="75" stroke="#2C3E50" stroke-width="2"/>
  <line x1="130" y1="88" x2="150" y2="88" stroke="#2C3E50" stroke-width="2"/>

  <!-- Cat paws -->
  <ellipse cx="75" cy="170" rx="10" ry="8" fill="#E67E22"/>
  <ellipse cx="100" cy="175" rx="10" ry="8" fill="#E67E22"/>
  <ellipse cx="125" cy="170" rx="10" ry="8" fill="#E67E22"/>

  <!-- Cat tail -->
  <path d="M 150 140 Q 170 120 160 100 Q 150 80 170 70" stroke="#FF8C42" stroke-width="8" fill="none"/>
</svg>